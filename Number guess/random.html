<html>
   <head>
      <title>Number guessing</title>
   </head>

   <body>

      <div class="container">

         <h1>Guess The Number</h1>

         <input type="number" id="num" placeholder="Enter number">

         <br><br>

         <button onclick="checkNumber()">Check</button>
         <div id="reveal" style="display: none;">
           <br><br>
           Do you want to reveal the correct answer?
           <button onclick="correctans()">Yes</button>
        </div>

         <p id="result"></p>

      </div>

      <script>

         let a = Math.floor(Math.random() * 39);
         let attempts=0
         let maxAttempts=5

         function checkNumber(){

            let num = Number(document.getElementById("num").value);
            attempts++
            if(num == a){
               document.getElementById("result").innerHTML =
               "You guessed the correct number";
            }

            else if (attempts >= maxAttempts) {

        document.getElementById("result").innerHTML =
            " You have used all 5 attempts.";

        document.getElementById("reveal").style.display = "block";
    }

            else if(num < a){
               document.getElementById("result").innerHTML =
               "You guessed a smaller number. Attempts left: " + (maxAttempts - attempts);
            }

            else{
               document.getElementById("result").innerHTML =
               "You guessed the larger number. Attempts left=" + (maxAttempts-attempts);
                document.getElementById("reveal").style.display = "block";
            }
         }

         function correctans() {

    document.getElementById("result").innerHTML +=
        "<br><br>✅ Correct Number: " + a;
}


      </script>

   </body>
</html>
